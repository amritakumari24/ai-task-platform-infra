apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-task-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/amritakumari24/ai-task-worker:33e5eee77f5c954d7ab7d1f6e11cb4463c7a4b93
          imagePullPolicy: IfNotPresent

          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, redis; redis.Redis(host=os.getenv('REDIS_HOST', 'redis'), port=6379, socket_connect_timeout=3).ping()"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, redis; redis.Redis(host=os.getenv('REDIS_HOST', 'redis'), port=6379, socket_connect_timeout=3).ping()"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"